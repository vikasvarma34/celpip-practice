spring.application.name=celpip-practice
server.address=127.0.0.1
server.port=47321
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=15s
celpip.data-dir=${CELPIP_DATA_DIR:${user.home}/CELPIP-Data}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=65MB
spring.servlet.multipart.file-size-threshold=0
server.tomcat.max-part-count=40
server.error.include-message=never
server.error.include-stacktrace=never

# Temporary user-requested Speaking test controls; disable for strict examination practice.
celpip.speaking.testing-early-finish=true
